<body>
<svg width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="t d">
  <title id="t">Sonnet 18 as a sun</title>
  <desc id="d">Shakespeare&#8217;s Sonnet 18 written along circular paths to form a sun, with phrases from the poem as rays.</desc>
  <defs>
    <path id="ring0" d="M450,360 A30,30 0 1 1 450,420 A30,30 0 1 1 450,360"/>
    <path id="ring1" d="M450,332 A58,58 0 1 1 450,448 A58,58 0 1 1 450,332"/>

    <path id="ring5" d="M450,203 A187,187 0 1 1 450,577 A187,187 0 1 1 450,203"/>
    <path id="ray0" d="M450.0,180.0 L450.0,22.0"/>
    <path id="ray1" d="M530.4,196.0 L568.6,103.6"/>

    <path id="ray8" d="M450.0,600.0 L450.0,758.0"/>
    <path id="ray9" d="M331.4,676.4 L369.6,584.0"/>
    <path id="ray10" d="M189.8,650.2 L301.5,538.5"/>
    <path id="ray11" d="M163.6,508.6 L256.0,470.4"/>
    <path id="ray12" d="M82.0,390.0 L240.0,390.0"/>
    <path id="ray13" d="M163.6,271.4 L256.0,309.6"/>
    <path id="ray14" d="M189.8,129.8 L301.5,241.5"/>
    <path id="ray15" d="M331.4,103.6 L369.6,196.0"/>
  </defs>
  <rect width="900" height="780" fill="#FFFBF2"/>
  <circle cx="450" cy="390" r="14" fill="#F59E0B"/>
  <g>
    <text font-size="9" fill="#7C2D12" textLength="182" lengthAdjust="spacing"><textPath href="#ring0" textLength="182" lengthAdjust="spacing">Sonnet 18 by William Shakespeare</textPath></text>
    <text font-size="11" fill="#9A3412" textLength="358" lengthAdjust="spacing"><textPath href="#ring1" textLength="358" lengthAdjust="spacing">So long lives this, and this gives life to thee.</textPath></text>
    <text font-size="11" fill="#B4440E" textLength="559" lengthAdjust="spacing"><textPath href="#ring2" textLength="559" lengthAdjust="spacing">When in eternal lines to time thou grow&#8217;st: So long as men can breathe or eyes can see,</textPath></text>
    <text font-size="11" fill="#C2570C" textLength="761" lengthAdjust="spacing"><textPath href="#ring3" textLength="761" lengthAdjust="spacing">But thy eternal summer shall not fade, Nor lose possession of that fair thou ow&#8217;st; Nor shall death brag thou wander&#8217;st in his shade,</textPath></text>
    <text font-size="11" fill="#D06A0B" textLength="962" lengthAdjust="spacing"><textPath href="#ring4" textLength="962" lengthAdjust="spacing">Sometime too hot the eye of heaven shines, And often is his gold complexion dimm&#8217;d; And every fair from fair sometime declines, By chance or nature&#8217;s changing course untrimm&#8217;d;</textPath></text>
    <text font-size="12.5" fill="#DB7F0A" textLength="1169" lengthAdjust="spacing"><textPath href="#ring5" textLength="1169" lengthAdjust="spacing">Shall I compare thee to a summer&#8217;s day? Thou art more lovely and more temperate: Rough winds do shake the darling buds of May, And summer&#8217;s lease hath all too short a date;</textPath></text>
  </g>
  <g>
    <text font-size="15" fill="#C2410C" text-anchor="middle" dy="0.35em"><textPath href="#ray0" startOffset="50%">thy eternal summer</textPath></text>
    <text font-size="13" fill="#D97706" text-anchor="middle" dy="0.35em"><textPath href="#ray1" startOffset="50%">fair</textPath></text>
    <text font-size="15" fill="#C2410C" text-anchor="middle" dy="0.35em"><textPath href="#ray2" startOffset="50%">more temperate</textPath></text>
    <text font-size="13" fill="#D97706" text-anchor="middle" dy="0.35em"><textPath href="#ray3" startOffset="50%">summer&#8217;s day</textPath></text>
    <text font-size="15" fill="#C2410C" text-anchor="middle" dy="0.35em"><textPath href="#ray4" startOffset="50%">so long lives this</textPath></text>
    <text font-size="13" fill="#D97706" text-anchor="middle" dy="0.35em"><textPath href="#ray5" startOffset="50%">shall not fade</textPath></text>
    <text font-size="15" fill="#C2410C" text-anchor="middle" dy="0.35em"><textPath href="#ray6" startOffset="50%">the eye of heaven</textPath></text>
    <text font-size="13" fill="#D97706" text-anchor="middle" dy="0.35em"><textPath href="#ray7" startOffset="50%">so long</textPath></text>
    <text font-size="15" fill="#C2410C" text-anchor="middle" dy="0.35em"><textPath href="#ray8" startOffset="50%">gives life to thee</textPath></text>
    <text font-size="13" fill="#D97706" text-anchor="middle" dy="0.35em"><textPath href="#ray9" startOffset="50%">breathe</textPath></text>
    <text font-size="15" fill="#C2410C" text-anchor="middle" dy="0.35em"><textPath href="#ray10" startOffset="50%">darling buds of May</textPath></text>
    <text font-size="13" fill="#D97706" text-anchor="middle" dy="0.35em"><textPath href="#ray11" startOffset="50%">eyes can see</textPath></text>
    <text font-size="15" fill="#C2410C" text-anchor="middle" dy="0.35em"><textPath href="#ray12" startOffset="50%">his gold complexion</textPath></text>
    <text font-size="13" fill="#D97706" text-anchor="middle" dy="0.35em"><textPath href="#ray13" startOffset="50%">lovely</textPath></text>
    <text font-size="15" fill="#C2410C" text-anchor="middle" dy="0.35em"><textPath href="#ray14" startOffset="50%">changing course</textPath></text>
    <text font-size="13" fill="#D97706" text-anchor="middle" dy="0.35em"><textPath href="#ray15" startOffset="50%">eternal lines</textPath></text>
  </g>
